<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in - Reconciliation Studio</title>
<style>
  :root{
    --ink:#121a35; --ink2:#4a5472; --ink3:#7b84a0;
    --canvas:#f2f4f9; --page:#fff; --rule:#e3e8f2;
    --accent:#ea580c; --accent-hi:#f97316; --accent-lo:#c2410c;
    --navy:#121a35; --side1:#1c3a8a; --side2:#0c1840;
    --break:#c0301c; --break-sunk:#fdeeea; --break-line:#f3c3ba;
    --f:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--f);font-size:14px;color:var(--ink2);background:var(--canvas);
    min-height:100vh;display:grid;place-items:center}
  .card{width:100%;max-width:380px;background:var(--page);border:1px solid var(--rule);border-radius:14px;
    padding:32px 30px;box-shadow:0 20px 50px -20px rgba(18,26,53,.25)}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:22px}
  .brand .dot{width:34px;height:34px;border-radius:9px;background:linear-gradient(145deg,var(--side1),var(--side2));
    display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px;letter-spacing:-.02em}
  .brand b{font-size:15.5px;font-weight:600;color:var(--ink);letter-spacing:-.01em}
  h1{margin:0 0 4px;font-size:19px;font-weight:600;color:var(--ink);letter-spacing:-.015em}
  p.sub{margin:0 0 22px;color:var(--ink3);font-size:13px}
  label{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin-bottom:6px}
  input[type=text],input[type=password]{width:100%;font-family:inherit;font-size:13.5px;color:var(--ink);
    background:#f6f8fc;border:1px solid var(--rule);border-radius:9px;padding:10px 12px;margin-bottom:16px}
  input:focus{outline:2px solid var(--accent-hi);outline-offset:1px;background:#fff}
  button{width:100%;font-family:inherit;font-size:13.5px;font-weight:600;color:#fff;
    background:linear-gradient(145deg,var(--accent-hi),var(--accent-lo));border:none;border-radius:9px;
    padding:11px;cursor:pointer}
  button:hover{filter:brightness(1.04)}
  .err{background:var(--break-sunk);border:1px solid var(--break-line);color:var(--break);
    font-size:13px;border-radius:8px;padding:9px 12px;margin-bottom:16px}
</style>
</head>
<body>
  <div class="card">
    <div class="brand"><span class="dot">RS</span><b>Reconciliation Studio</b></div>
    <h1>Sign in</h1>
    <p class="sub">Enter your credentials to open the workspace.</p>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </form>
  </div>
</body>
</html>
