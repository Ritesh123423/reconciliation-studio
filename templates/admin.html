<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin - Reconciliation Studio</title>
<style>
  :root{
    --ink:#121a35; --ink2:#4a5472; --ink3:#7b84a0; --ink4:#a6adc3;
    --canvas:#f2f4f9; --page:#fff; --sunk:#f6f8fc;
    --rule:#e3e8f2; --rule2:#edf0f7;
    --accent:#ea580c; --accent-hi:#f97316; --accent-lo:#c2410c; --accent-sunk:#fff3ea; --accent-line:#fbd2b3;
    --navy:#121a35; --side1:#1c3a8a; --side2:#0c1840;
    --agree:#0d8a67; --agree-sunk:#e8f7f1;
    --break:#c0301c; --break-sunk:#fdeeea; --break-line:#f3c3ba;
    --f:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--f);font-size:14px;color:var(--ink2);background:var(--canvas)}
  .top{display:flex;align-items:center;justify-content:space-between;padding:14px 26px;
    background:#fff;border-bottom:1px solid var(--rule)}
  .brand{display:flex;align-items:center;gap:10px}
  .brand .dot{width:30px;height:30px;border-radius:8px;background:linear-gradient(145deg,var(--side1),var(--side2));
    display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px}
  .brand b{font-size:15px;font-weight:600;color:var(--ink);letter-spacing:-.01em}
  .top a{color:var(--ink2);text-decoration:none;font-size:13px;font-weight:500}
  .top a:hover{color:var(--ink)}
  main{max-width:760px;margin:0 auto;padding:28px 20px 60px}
  h1{margin:0 0 18px;font-size:19px;font-weight:600;color:var(--ink);letter-spacing:-.015em}
  .panel{background:var(--page);border:1px solid var(--rule);border-radius:12px;padding:20px 22px;margin-bottom:22px}
  .panel h2{font-size:14.5px;font-weight:600;color:var(--ink);margin:0 0 14px}
  .err{background:var(--break-sunk);border:1px solid var(--break-line);color:var(--break);
    font-size:13px;border-radius:8px;padding:9px 12px;margin-bottom:16px}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
  .fld{flex:1;min-width:160px}
  label{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:5px}
  input[type=text],input[type=password]{width:100%;font-family:inherit;font-size:13px;color:var(--ink);
    background:var(--sunk);border:1px solid var(--rule);border-radius:8px;padding:9px 11px}
  input:focus{outline:2px solid var(--accent-hi);outline-offset:1px;background:#fff}
  .chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2);padding:9px 0 0}
  button{font-family:inherit;font-size:13px;font-weight:600;color:#fff;cursor:pointer;
    background:linear-gradient(145deg,var(--accent-hi),var(--accent-lo));border:none;border-radius:8px;
    padding:10px 18px}
  button:hover{filter:brightness(1.04)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;color:var(--ink3);font-weight:600;font-size:11.5px;text-transform:uppercase;
    letter-spacing:.03em;padding:8px 10px;border-bottom:1px solid var(--rule)}
  td{padding:10px;border-bottom:1px solid var(--rule2);color:var(--ink2)}
  tr:last-child td{border-bottom:none}
  .badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px}
  .badge.admin{background:var(--accent-sunk);color:var(--accent-lo);border:1px solid var(--accent-line)}
  .badge.user{background:var(--sunk);color:var(--ink3);border:1px solid var(--rule)}
  .del{background:none;border:1px solid var(--rule);color:var(--break);padding:6px 11px;font-size:12px}
  .del:hover{background:var(--break-sunk);filter:none}
</style>
</head>
<body>
  <div class="top">
    <div class="brand"><span class="dot">RS</span><b>Admin</b></div>
    <div style="display:flex;gap:18px">
      <a href="/">Open workspace</a>
      <a href="/logout">Log out</a>
    </div>
  </div>
  <main>
    <h1>User management</h1>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}

    <div class="panel">
      <h2>Create login</h2>
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="action" value="create">
        <div class="row">
          <div class="fld">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required>
          </div>
          <div class="fld">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required minlength="8">
          </div>
          <label class="chk"><input type="checkbox" name="is_admin"> Admin</label>
          <button type="submit">Create</button>
        </div>
      </form>
    </div>

    <div class="panel">
      <h2>Existing logins ({{ users|length }})</h2>
      <table>
        <thead><tr><th>Username</th><th>Role</th><th>Created</th><th></th></tr></thead>
        <tbody>
          {% for u in users %}
          <tr>
            <td>{{ u.username }}</td>
            <td>{% if u.is_admin %}<span class="badge admin">Admin</span>{% else %}<span class="badge user">User</span>{% endif %}</td>
            <td>{{ u.created_at }}</td>
            <td style="text-align:right">
              <form method="post" style="display:inline" onsubmit="return confirm('Delete ' + {{ u.username|tojson }} + '?');">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <input type="hidden" name="action" value="delete">
                <input type="hidden" name="user_id" value="{{ u.id }}">
                <button type="submit" class="del">Delete</button>
              </form>
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </main>
</body>
</html>
